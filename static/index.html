<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIR Chargesheet-Delay Predictor</title>
<style>
  :root { --ink:#1f2d3d; --muted:#5b6b7b; --line:#d9e1e8; --bg:#f4f6f8; --high:#c0392b; --med:#e67e22; --low:#27ae60; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#2c3e50; color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:#cfd8e0; font-size:13px; }
  main { display:grid; grid-template-columns: minmax(320px, 1.2fr) minmax(300px, 1fr); gap:16px; padding:16px; max-width:1150px; margin:auto; }
  .card { background:#fff; border-radius:8px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  form { display:grid; grid-template-columns: 1fr 1fr; gap:10px 14px; }
  label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  input, select { font-size:14px; padding:7px 8px; border:1px solid var(--line); border-radius:6px; }
  .checks { grid-column: 1 / 3; display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  .checks label { flex-direction:row; align-items:center; gap:8px; color:var(--ink); font-size:13px; }
  button { grid-column: 1 / 3; padding:10px; font-size:15px; background:#2c3e50; color:#fff; border:0; border-radius:6px; cursor:pointer; }
  button:hover { background:#1a252f; }
  .prob { font-size:40px; font-weight:700; margin:4px 0; }
  .bar { height:12px; background:#eceff1; border-radius:6px; overflow:hidden; }
  .bar > div { height:100%; width:0; transition: width .4s; }
  .band { display:inline-block; color:#fff; padding:2px 10px; border-radius:12px; font-weight:600; }
  ul { padding-left:18px; } li { margin:6px 0; }
  .err { color:var(--high); white-space:pre-wrap; font-size:13px; }
  .imp { display:grid; grid-template-columns: 170px 1fr; gap:4px 8px; font-size:12px; align-items:center; }
  .imp div.b { height:8px; background:#5d7b97; border-radius:4px; }
  small { color:var(--muted); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } form { grid-template-columns: 1fr; } .checks, button { grid-column: 1; } }
</style>
</head>
<body>
<header>
  <h1>FIR Chargesheet-Delay Predictor</h1>
  <p>Estimates whether a case is likely to miss the 90-day chargesheet deadline, so supervisors can act early. Synthetic data, academic project (CSL236).</p>
</header>
<main>
  <section class="card">
    <form id="f">
      <label>Crime type<select name="crime_type" id="crime_type"></select></label>
      <label>Police station<select name="police_station" id="police_station"></select></label>
      <label>Hour of occurrence (0-23)<input name="hour_of_occurrence" type="number" min="0" max="23" value="21" required></label>
      <label>Month (1-12)<input name="month" type="number" min="1" max="12" value="8" required></label>
      <label>Number of accused (1-15)<input name="num_accused" type="number" min="1" max="15" value="3" required></label>
      <label>Number of witnesses (0-30)<input name="num_witnesses" type="number" min="0" max="30" value="1" required></label>
      <label>Property value, Rs (0 if none)<input name="property_value_inr" type="number" min="0" step="100" value="250000" required></label>
      <label>IO open caseload (1-60)<input name="io_caseload" type="number" min="1" max="60" value="42" required></label>
      <label>Days from offence to FIR (0-365)<input name="registration_delay_days" type="number" min="0" max="365" value="2" required></label>
      <div class="checks">
        <label><input type="checkbox" name="has_cctv"> CCTV footage available</label>
        <label><input type="checkbox" name="has_cdr_evidence" checked> Call records (CDR) needed</label>
        <label><input type="checkbox" name="has_financial_trail" checked> Financial trail involved</label>
        <label><input type="checkbox" name="forensic_required" checked> Forensic examination needed</label>
        <label><input type="checkbox" name="repeat_offender_involved"> Accused named in earlier FIRs</label>
      </div>
      <button type="submit">Predict delay risk</button>
    </form>
  </section>
  <section class="card" id="out">
    <h3 style="margin-top:0">Result</h3>
    <p><small>Fill the form and press <b>Predict</b>.</small></p>
  </section>
  <section class="card" style="grid-column:1/-1">
    <h3 style="margin-top:0">What drives the model (permutation importance)</h3>
    <div class="imp" id="imp"><small>Loading...</small></div>
  </section>
</main>
<script>
const CRIMES = ["Theft","Vehicle Theft","Chain Snatching","Burglary","Robbery","Assault","Extortion","Cyber Fraud","Narcotics","Money Laundering","Illegal Arms","Sexual Offence"];
const STATIONS = ["Bhawarkuan","Rajwada","Chandan Nagar","Rau","Palasia","Vijay Nagar","Sector 12","Dewas Naka","Karol Bagh"];
const fill = (id, opts, sel) => { const s = document.getElementById(id);
  opts.forEach(o => { const e = document.createElement("option"); e.value = e.textContent = o; if (o === sel) e.selected = true; s.appendChild(e); }); };
fill("crime_type", CRIMES, "Money Laundering"); fill("police_station", STATIONS, "Rau");
const colour = { High: "var(--high)", Medium: "var(--med)", Low: "var(--low)" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target), body = {};
  for (const el of ev.target.elements) {
    if (!el.name) continue;
    if (el.type === "checkbox") body[el.name] = el.checked;
    else if (el.type === "number") body[el.name] = el.name === "property_value_inr" ? parseFloat(el.value) : parseInt(el.value, 10);
    else body[el.name] = fd.get(el.name);
  }
  const out = document.getElementById("out");
  try {
    const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) { out.innerHTML = `<h3 style="margin-top:0">Input rejected (${r.status})</h3><div class="err">${esc(JSON.stringify(j.detail, null, 2))}</div>`; return; }
    const pct = Math.round(j.delay_probability * 100);
    out.innerHTML = `<h3 style="margin-top:0">Result</h3>
      <div class="prob">${pct}%</div><div class="bar"><div style="width:${pct}%;background:${colour[j.risk_band]}"></div></div>
      <p><span class="band" style="background:${colour[j.risk_band]}">${j.risk_band} risk</span>
      &nbsp;${j.predicted_delayed ? "Likely to miss the 90-day deadline" : "Likely to be filed within 90 days"}</p>
      <h4>Suggested next steps</h4><ul>${j.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <small>Model: ${esc(j.model)}. Every prediction input is logged for drift monitoring.</small>`;
  } catch (e) { out.innerHTML = `<div class="err">Request failed: ${esc(e)}</div>`; }
});

fetch("/model-info").then(r => r.json()).then(j => {
  const imp = (j.feature_importance || []).filter(x => x.importance > 0);
  const max = Math.max(...imp.map(x => x.importance), 1e-9);
  document.getElementById("imp").innerHTML = imp.length ? imp.map(x =>
    `<span>${esc(x.feature.replaceAll("_", " "))}</span><div class="b" style="width:${(x.importance / max * 100).toFixed(0)}%"></div>`).join("")
    : "<small>No importance data.</small>";
}).catch(() => {});
</script>
</body>
</html>
